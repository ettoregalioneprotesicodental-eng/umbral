# Base de datos local para desarrollo. Uso: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: umbral
      POSTGRES_PASSWORD: umbral_dev
      POSTGRES_DB: umbral
    ports:
      - "5432:5432"
    volumes:
      - umbral-db:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
volumes:
  umbral-db:
